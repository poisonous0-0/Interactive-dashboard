<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Framer Solo Leveling Tracker</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link
		href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div class="bg-fx"></div>
	<div class="app-shell">
		<header class="header-panel">
			<div class="header-top">
				<div class="brand">
					<i class="fa-solid fa-shield-halved brand-icon"></i>
					<div>
						<h1 class="app-title">
							Framer <span>Solo Leveling</span> Tracker
						</h1>
						<p class="app-subtitle">
							Hunter Association &mdash; Progress Management System
						</p>
					</div>
				</div>
				<button class="btn-reset" id="resetBtn" title="Reset all progress">
					<i class="fa-solid fa-rotate-right"></i> Reset
				</button>
			</div>
			<div class="header-main">
				<div class="avatar-block">
					<div class="avatar-ring">
						<i class="fa-solid fa-user-ninja"></i>
						<span class="avatar-rank-badge" id="avatarRankBadge">E</span>
					</div>
				</div>
				<div class="quote-block">
					<i class="fa-solid fa-quote-left quote-icon"></i>
					<p class="quote-text" id="quoteText">Loading...</p>
					<button class="btn-quote" id="newQuoteBtn">
						<i class="fa-solid fa-shuffle"></i> New Quote
					</button>
				</div>
			</div>
		</header>

		<main class="dashboard-grid">
			<div class="main-column">
				<section class="card hunter-status-panel" id="hunterStatusPanel"></section>
				<section class="card resources-panel" id="resourcesPanel"></section>
				<section class="card quest-board" id="questBoard"></section>
				<section class="card skills-panel" id="skillsPanel"></section>
				<section class="card log-panel" id="logPanel"></section>
			</div>
			<aside class="sidebar-column">
				<section class="card achievements-panel" id="achievementsPanel"></section>
				<section class="card rewards-panel" id="rewardsPanel"></section>
			</aside>
		</main>

		<footer class="app-footer">
			<p>
				Framer Solo Leveling Tracker &mdash; all progress is saved
				automatically in this browser.
			</p>
		</footer>
	</div>

	<div class="toast-container" id="toastContainer"></div>

	<script src="app.js"></script>
</body>

</html>
