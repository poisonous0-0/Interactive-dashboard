<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Framer Solo Leveling Tracker</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
		<style>
			/* ============================================================
   ROOT / RESET
   ============================================================ */
			:root {
				--void: #06050a;
				--deep: #0d0b14;
				--panel: #120f1c;
				--card: #161225;
				--card-2: #1b1630;
				--line: rgba(179, 136, 255, 0.16);
				--line-strong: rgba(179, 136, 255, 0.34);

				--purple: #8a2be2;
				--purple-light: #b388ff;
				--purple-deep: #5b1fb0;
				--blue: #3fc5ff;
				--gold: #ffd166;
				--gold-deep: #e6a417;

				--text: #f1eefc;
				--text-dim: #a79dc4;
				--text-faint: #6e6588;

				--green: #3ddc84;
				--red: #ff5c7a;

				--r-e: #8b93a8;
				--r-d: #3ddc84;
				--r-c: #3fc5ff;
				--r-b: #b388ff;
				--r-a: #ff9f43;
				--r-s: #ffd166;

				--radius: 16px;
				--radius-sm: 10px;
				--font-head: "Orbitron", sans-serif;
				--font-body: "Inter", sans-serif;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html {
				scroll-behavior: smooth;
			}
			body {
				margin: 0;
				font-family: var(--font-body);
				color: var(--text);
				background:
					radial-gradient(
						1200px 600px at 15% -10%,
						rgba(138, 43, 226, 0.18),
						transparent 60%
					),
					radial-gradient(
						900px 500px at 110% 10%,
						rgba(63, 197, 255, 0.1),
						transparent 55%
					),
					radial-gradient(
						1000px 700px at 50% 120%,
						rgba(138, 43, 226, 0.14),
						transparent 60%
					),
					linear-gradient(180deg, var(--deep) 0%, var(--void) 100%);
				background-attachment: fixed;
				min-height: 100vh;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}
			::selection {
				background: var(--purple);
				color: #fff;
			}
			a {
				color: inherit;
			}

			/* subtle scanline / grid texture overlay */
			.bg-fx {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 0;
				background-image:
					linear-gradient(rgba(179, 136, 255, 0.035) 1px, transparent 1px),
					linear-gradient(
						90deg,
						rgba(179, 136, 255, 0.035) 1px,
						transparent 1px
					);
				background-size: 42px 42px;
				mask-image: radial-gradient(
					ellipse 80% 60% at 50% 20%,
					#000 30%,
					transparent 75%
				);
			}

			::-webkit-scrollbar {
				width: 10px;
				height: 10px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: var(--purple-deep);
				border-radius: 10px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: var(--purple);
			}

			.app-shell {
				position: relative;
				z-index: 1;
				max-width: 1400px;
				margin: 0 auto;
				padding: 28px 24px 60px;
			}

			h1,
			h2,
			h3 {
				font-family: var(--font-head);
				margin: 0;
				letter-spacing: 0.03em;
			}

			button {
				font-family: var(--font-body);
				cursor: pointer;
			}
			input[type="number"],
			input[type="text"] {
				font-family: var(--font-body);
			}

			/* ============================================================
   CARD BASE
   ============================================================ */
			.card {
				position: relative;
				background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				padding: 22px 24px;
				box-shadow:
					0 0 0 1px rgba(0, 0, 0, 0.2) inset,
					0 18px 40px -20px rgba(0, 0, 0, 0.6),
					0 0 24px -8px rgba(138, 43, 226, 0.15);
				margin-bottom: 22px;
				overflow: hidden;
			}
			.card::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(
					90deg,
					transparent,
					var(--purple-light),
					transparent
				);
				opacity: 0.55;
			}
			.card-title {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 15px;
				font-weight: 700;
				letter-spacing: 0.09em;
				text-transform: uppercase;
				color: var(--text);
				margin-bottom: 18px;
			}
			.card-title i {
				color: var(--purple-light);
				font-size: 15px;
			}
			.card-title .sub {
				font-family: var(--font-body);
				text-transform: none;
				letter-spacing: 0;
				font-size: 12px;
				font-weight: 500;
				color: var(--text-faint);
				margin-left: auto;
			}

			/* ============================================================
   HEADER
   ============================================================ */
			.header-panel {
				background: linear-gradient(
					160deg,
					rgba(27, 22, 48, 0.85),
					rgba(13, 11, 20, 0.9)
				);
				border: 1px solid var(--line-strong);
				border-radius: var(--radius);
				padding: 22px 26px;
				margin-bottom: 26px;
				box-shadow:
					0 0 40px -12px rgba(138, 43, 226, 0.35),
					0 20px 45px -25px rgba(0, 0, 0, 0.7);
				position: relative;
			}
			.header-top {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 16px;
				margin-bottom: 18px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
			}
			.brand-icon {
				font-size: 26px;
				color: var(--purple-light);
				filter: drop-shadow(0 0 10px rgba(179, 136, 255, 0.7));
			}
			.app-title {
				font-size: clamp(20px, 3vw, 30px);
				font-weight: 900;
				text-transform: uppercase;
				color: #fff;
				text-shadow: 0 0 18px rgba(138, 43, 226, 0.55);
			}
			.app-title span {
				background: linear-gradient(90deg, var(--purple-light), var(--blue));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.app-subtitle {
				margin: 4px 0 0;
				font-size: 12.5px;
				color: var(--text-faint);
				letter-spacing: 0.06em;
			}
			.btn-reset {
				display: flex;
				align-items: center;
				gap: 8px;
				background: rgba(255, 92, 122, 0.08);
				border: 1px solid rgba(255, 92, 122, 0.35);
				color: #ffb1c2;
				font-size: 12.5px;
				font-weight: 600;
				padding: 9px 14px;
				border-radius: 10px;
				white-space: nowrap;
				transition: all 0.18s ease;
			}
			.btn-reset:hover {
				background: rgba(255, 92, 122, 0.18);
				box-shadow: 0 0 16px -4px rgba(255, 92, 122, 0.6);
			}

			.header-main {
				display: flex;
				align-items: center;
				gap: 22px;
				flex-wrap: wrap;
			}
			.avatar-block {
				flex-shrink: 0;
			}
			.avatar-ring {
				position: relative;
				width: 74px;
				height: 74px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(
					circle at 35% 30%,
					rgba(179, 136, 255, 0.35),
					rgba(13, 11, 20, 0.9)
				);
				border: 2px solid var(--purple-light);
				box-shadow:
					0 0 0 4px rgba(138, 43, 226, 0.12),
					0 0 24px -2px rgba(179, 136, 255, 0.7);
			}
			.avatar-ring i {
				font-size: 30px;
				color: #fff;
				filter: drop-shadow(0 0 6px rgba(179, 136, 255, 0.8));
			}
			.avatar-rank-badge {
				position: absolute;
				bottom: -6px;
				right: -6px;
				width: 26px;
				height: 26px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: var(--font-head);
				font-weight: 800;
				font-size: 13px;
				background: var(--gold);
				color: #2b1e00;
				border: 2px solid var(--void);
				box-shadow: 0 0 10px rgba(255, 209, 102, 0.8);
			}
			.quote-block {
				flex: 1;
				min-width: 240px;
				display: flex;
				align-items: center;
				gap: 12px;
				background: rgba(0, 0, 0, 0.18);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 12px 16px;
			}
			.quote-icon {
				color: var(--purple-light);
				font-size: 16px;
				opacity: 0.7;
				flex-shrink: 0;
			}
			.quote-text {
				flex: 1;
				margin: 0;
				font-size: 13.5px;
				font-style: italic;
				color: var(--text-dim);
			}
			.btn-quote {
				flex-shrink: 0;
				background: rgba(179, 136, 255, 0.1);
				border: 1px solid var(--line-strong);
				color: var(--purple-light);
				font-size: 12px;
				font-weight: 600;
				padding: 8px 12px;
				border-radius: 9px;
				display: flex;
				align-items: center;
				gap: 6px;
				transition: all 0.18s ease;
				white-space: nowrap;
			}
			.btn-quote:hover {
				background: rgba(179, 136, 255, 0.22);
			}

			/* ============================================================
   LAYOUT GRID
   ============================================================ */
			.dashboard-grid {
				display: grid;
				grid-template-columns: 2fr 1fr;
				gap: 22px;
				align-items: start;
			}
			.main-column,
			.sidebar-column {
				min-width: 0;
			}
			@media (max-width: 980px) {
				.dashboard-grid {
					grid-template-columns: 1fr;
				}
			}

			/* ============================================================
   HUNTER STATUS PANEL
   ============================================================ */
			.status-top {
				display: flex;
				flex-wrap: wrap;
				gap: 18px;
				align-items: center;
				margin-bottom: 20px;
			}
			.status-chip {
				display: flex;
				flex-direction: column;
				gap: 2px;
				padding: 10px 18px;
				border-radius: 12px;
				background: rgba(0, 0, 0, 0.22);
				border: 1px solid var(--line);
				min-width: 110px;
			}
			.status-chip .label {
				font-size: 10.5px;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				color: var(--text-faint);
				font-weight: 700;
			}
			.status-chip .value {
				font-family: var(--font-head);
				font-size: 22px;
				font-weight: 800;
				color: #fff;
			}
			.status-chip.rank .value {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.rank-pill {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 34px;
				height: 34px;
				border-radius: 9px;
				font-family: var(--font-head);
				font-weight: 900;
				font-size: 16px;
				color: #0c0a13;
				box-shadow: 0 0 16px -2px var(--pill-glow, rgba(255, 209, 102, 0.7));
			}
			.status-title {
				font-size: 13.5px;
				color: var(--purple-light);
				font-weight: 600;
				margin-top: -6px;
			}
			.status-next {
				margin-left: auto;
				text-align: right;
				font-size: 12px;
				color: var(--text-faint);
			}
			.status-next b {
				color: var(--text-dim);
			}

			.xp-wrap {
				margin-top: 4px;
			}
			.xp-label-row {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				margin-bottom: 8px;
			}
			.xp-label-row .lvl-text {
				font-size: 12.5px;
				color: var(--text-faint);
				letter-spacing: 0.05em;
				text-transform: uppercase;
				font-weight: 700;
			}
			.xp-label-row .xp-num {
				font-family: var(--font-head);
				font-size: 14px;
				color: var(--purple-light);
				font-weight: 700;
			}
			.xp-bar-outer {
				position: relative;
				height: 22px;
				border-radius: 11px;
				overflow: hidden;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid var(--line-strong);
			}
			.xp-bar-fill {
				height: 100%;
				border-radius: 11px;
				background: linear-gradient(
					90deg,
					var(--purple-deep),
					var(--purple),
					var(--purple-light)
				);
				box-shadow: 0 0 14px rgba(179, 136, 255, 0.8);
				transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
				position: relative;
				overflow: hidden;
			}
			.xp-bar-fill::after {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(
					110deg,
					transparent 30%,
					rgba(255, 255, 255, 0.35) 50%,
					transparent 70%
				);
				background-size: 200% 100%;
				animation: shimmer 2.6s linear infinite;
			}
			@keyframes shimmer {
				0% {
					background-position: 200% 0;
				}
				100% {
					background-position: -40% 0;
				}
			}
			.xp-bar-text {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.05em;
				color: #fff;
				text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
			}
			.xp-total-note {
				margin-top: 8px;
				font-size: 11.5px;
				color: var(--text-faint);
			}
			.xp-total-note b {
				color: var(--text-dim);
			}

			/* ============================================================
   RESOURCES PANEL
   ============================================================ */
			.res-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
				gap: 14px;
				margin-bottom: 20px;
			}
			.res-card {
				background: rgba(0, 0, 0, 0.22);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 14px 16px;
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.res-card .top {
				display: flex;
				align-items: center;
				gap: 8px;
				color: var(--text-faint);
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				font-weight: 700;
			}
			.res-card i {
				font-size: 13px;
			}
			.res-card.gold i {
				color: var(--gold);
			}
			.res-card.gems i {
				color: var(--blue);
			}
			.res-card.energy i {
				color: var(--green);
			}
			.res-card.streak i {
				color: #ff9f43;
			}
			.res-card .val {
				font-family: var(--font-head);
				font-size: 22px;
				font-weight: 800;
				color: #fff;
			}
			.energy-bar-outer {
				height: 6px;
				border-radius: 4px;
				background: rgba(0, 0, 0, 0.4);
				overflow: hidden;
				margin-top: 2px;
			}
			.energy-bar-fill {
				height: 100%;
				background: linear-gradient(90deg, var(--green), #7dffb0);
				transition: width 0.4s ease;
			}

			.social-title {
				font-size: 12px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--text-faint);
				margin: 6px 0 12px;
			}
			.social-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
				gap: 14px;
			}
			.social-card {
				background: rgba(0, 0, 0, 0.22);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 12px 14px;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			.social-card i {
				font-size: 18px;
				width: 22px;
				text-align: center;
			}
			.social-card.x i {
				color: #fff;
			}
			.social-card.linkedin i {
				color: #3fc5ff;
			}
			.social-card.instagram i {
				color: #ff6fa5;
			}
			.social-card.framer i {
				color: var(--purple-light);
			}
			.social-meta {
				flex: 1;
			}
			.social-meta .name {
				font-size: 11px;
				color: var(--text-faint);
				text-transform: uppercase;
				letter-spacing: 0.06em;
				font-weight: 700;
			}
			.social-input {
				width: 100%;
				margin-top: 3px;
				background: transparent;
				border: none;
				border-bottom: 1px solid var(--line);
				color: #fff;
				font-family: var(--font-head);
				font-size: 16px;
				font-weight: 700;
				padding: 2px 0;
			}
			.social-input:focus {
				outline: none;
				border-bottom-color: var(--purple-light);
			}
			.reach-total {
				margin-top: 14px;
				text-align: right;
				font-size: 12px;
				color: var(--text-faint);
			}
			.reach-total b {
				color: var(--purple-light);
				font-family: var(--font-head);
				font-size: 14px;
			}

			/* ============================================================
   QUEST BOARD
   ============================================================ */
			.quest-grid {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.quest-row {
				display: flex;
				align-items: center;
				gap: 14px;
				background: rgba(0, 0, 0, 0.2);
				border: 1px solid var(--line);
				border-radius: 12px;
				padding: 13px 16px;
				transition: all 0.18s ease;
			}
			.quest-row:hover {
				border-color: var(--line-strong);
			}
			.quest-row.done {
				background: rgba(138, 43, 226, 0.1);
				border-color: rgba(138, 43, 226, 0.4);
			}
			.quest-check {
				flex-shrink: 0;
				width: 26px;
				height: 26px;
				border-radius: 8px;
				position: relative;
				cursor: pointer;
				border: 2px solid var(--line-strong);
				background: rgba(0, 0, 0, 0.3);
				transition: all 0.15s ease;
			}
			.quest-check input {
				position: absolute;
				inset: 0;
				opacity: 0;
				cursor: pointer;
				margin: 0;
			}
			.quest-check i {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff;
				font-size: 13px;
				opacity: 0;
				transform: scale(0.5);
				transition: all 0.15s ease;
			}
			.quest-row.done .quest-check {
				background: linear-gradient(140deg, var(--purple), var(--purple-deep));
				border-color: var(--purple-light);
				box-shadow: 0 0 12px rgba(179, 136, 255, 0.6);
			}
			.quest-row.done .quest-check i {
				opacity: 1;
				transform: scale(1);
			}
			.quest-icon {
				flex-shrink: 0;
				width: 36px;
				height: 36px;
				border-radius: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(179, 136, 255, 0.1);
				color: var(--purple-light);
				font-size: 15px;
			}
			.quest-info {
				flex: 1;
				min-width: 0;
			}
			.quest-info .name {
				font-size: 14px;
				font-weight: 600;
				color: var(--text);
			}
			.quest-row.done .quest-info .name {
				color: var(--text-dim);
				text-decoration: line-through;
				text-decoration-color: var(--text-faint);
			}
			.quest-info .desc {
				font-size: 11.5px;
				color: var(--text-faint);
				margin-top: 1px;
			}
			.quest-reward {
				flex-shrink: 0;
				display: flex;
				gap: 8px;
			}
			.quest-badge {
				font-family: var(--font-head);

						d.getFullYear() +
						"-" +
						pad2(d.getMonth() + 1) +
						"-" +
						pad2(d.getDate())
					);
				}

				function getWeekKey(date) {
					const d = new Date(
						Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
					);
					const dayNum = d.getUTCDay() || 7;
					d.setUTCDate(d.getUTCDate() + 4 - dayNum);
					const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
					const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
					return d.getUTCFullYear() + "-W" + weekNo;
				}

				function clamp(v, lo, hi) {
					return Math.max(lo, Math.min(hi, v));
				}

				function escapeHtml(str) {
					return String(str == null ? "" : str)
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;")
						.replace(/'/g, "&#39;");
				}

				function defaultState() {
					const now = new Date();
					return {
						version: 1,
						hunter: {
							level: 1,
							xp: 0,
							totalXpAllTime: 0,
							rank: "E",
							title: "The Weakest Hunter",
						},
						resources: {
							gold: 0,
							gems: 0,
							energy: 100,
							streak: 0,
							followers: { x: 0, linkedin: 0, instagram: 0, framer: 0 },
						},
						skills: {
							framer: 0,
							design: 0,
							motion: 0,
							content: 0,
							marketing: 0,
							sales: 0,
							templates: 0,
						},
						today: {
							date: todayStr(now),
							quests: {
								learn: false,
								build: false,
								post: false,
								study: false,
								notes: false,
							},
							weeklyQuest: false,
							weekKey: getWeekKey(now),
							notes: "",
							bonusGranted: false,
						},
						stats: {
							totalQuestsCompleted: 0,
							totalBuilds: 0,
							totalPosts: 0,
							totalLearns: 0,
							totalStudies: 0,
							totalNotesUpdates: 0,
							perfectDays: 0,
							bestStreak: 0,
						},
						achievements: {},
						claimedMilestones: [],
						logs: [],
						currentQuoteIndex: 0,
					};
				}

				function loadState() {
					try {
						const raw = localStorage.getItem(STORAGE_KEY);
						if (raw) {
							const parsed = JSON.parse(raw);
							const merged = defaultState();
							// shallow+nested merge so new fields introduced later always exist
							merged.hunter = Object.assign(merged.hunter, parsed.hunter);
							merged.resources = Object.assign(
								merged.resources,
								parsed.resources,
							);
							if (parsed.resources && parsed.resources.followers)
								merged.resources.followers = Object.assign(
									merged.resources.followers,
									parsed.resources.followers,
								);
							merged.skills = Object.assign(merged.skills, parsed.skills);
							merged.today = Object.assign(merged.today, parsed.today);
							if (parsed.today && parsed.today.quests)
								merged.today.quests = Object.assign(
									merged.today.quests,
									parsed.today.quests,
								);
							merged.stats = Object.assign(merged.stats, parsed.stats);
							merged.achievements = Object.assign(
								merged.achievements,
								parsed.achievements,
							);
							merged.claimedMilestones = parsed.claimedMilestones || [];
							merged.logs = parsed.logs || [];
							merged.currentQuoteIndex =
								typeof parsed.currentQuoteIndex === "number"
									? parsed.currentQuoteIndex
									: 0;
							return merged;
						}
					} catch (e) {
						/* corrupted storage, fall back to defaults */
					}
					return defaultState();
				}

				function saveState() {
					try {
						localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
					} catch (e) {
						/* storage unavailable or full - fail silently */
					}
				}

				/* ============================================================
   TOASTS
   ============================================================ */
				function showToast(message, type) {
					const container = document.getElementById("toastContainer");
					const el = document.createElement("div");
					el.className = "toast" + (type ? " " + type : "");
					el.textContent = message;
					container.appendChild(el);
					setTimeout(() => {
						el.remove();
					}, 4200);
				}

				/* ============================================================
   CORE LEVEL / RANK ENGINE
   ============================================================ */
				function getTierForLevel(level) {
					let tier = TIERS[0];
					for (const t of TIERS) {
						if (level >= t.minLevel) tier = t;
						else break;
					}
					return tier;
				}

				function updateRankAndTitle() {
					const h = state.hunter;
					const tier = getTierForLevel(h.level);
					const rankChanged = tier.rank !== h.rank;
					h.rank = tier.rank;
					h.title = tier.title;
					if (rankChanged) {
						showToast(
							"\u{1F53A} RANK UP! Welcome to " + tier.rank + "-RANK",
							"rankup",
						);
					}
				}

				function checkMilestones() {
					MILESTONES.forEach((m) => {
						if (
							state.hunter.level >= m.level &&
							state.claimedMilestones.indexOf(m.level) === -1
						) {
							state.claimedMilestones.push(m.level);
							if (m.gold) state.resources.gold += m.gold;
							if (m.gems) state.resources.gems += m.gems;
							showToast(
								"\u{1F381} Milestone Unlocked: " + m.label,
								"milestone",
							);
						}
					});
				}

				function addXP(amount) {
					const h = state.hunter;
					h.totalXpAllTime = Math.max(0, h.totalXpAllTime + amount);
					const prevLevel = h.level;
					h.xp += amount;
					while (h.xp >= 100) {
						h.xp -= 100;
						h.level += 1;
					}
					while (h.xp < 0) {
						if (h.level > 1) {
							h.level -= 1;
							h.xp += 100;
						} else {
							h.xp = 0;
							break;
						}
					}
					if (h.level !== prevLevel) {
						updateRankAndTitle();
						if (h.level > prevLevel) {
							showToast(
								"\u26A1 LEVEL UP! You are now Level " + h.level,
								"levelup",
							);
						}
						checkMilestones();
					}
				}

				function computeAchievements() {
					ACHIEVEMENT_DEFS.forEach((def) => {
						if (!state.achievements[def.id] && def.test(state)) {
							state.achievements[def.id] = true;
							showToast(
								"\u{1F3C6} Achievement Unlocked: " + def.label + "!",
								"achievement",
							);
						}
					});
				}

				/* ============================================================
   DAY ROLLOVER
   ============================================================ */
				function finalizeDay(day) {
					let xpEarned = 0;
					QUEST_DEFS.forEach((q) => {
						if (day.quests[q.id]) xpEarned += q.xp;
					});
					if (day.weeklyQuest) xpEarned += WEEKLY_QUEST.xp;

					const allDone = QUEST_DEFS.every((q) => day.quests[q.id]);
					if (allDone) {
						state.resources.streak += 1;
					} else {
						state.resources.streak = 0;
					}
					state.stats.bestStreak = Math.max(
						state.stats.bestStreak,
						state.resources.streak,
					);

					const entry = {
						date: day.date,
						dayName: new Date(day.date + "T00:00:00").toLocaleDateString(
							"en-US",
							{ weekday: "short" },
						),
						build: !!day.quests.build,
						learn: !!day.quests.learn,
						post: !!day.quests.post,
						weeklyQuest: !!day.weeklyQuest,
						xpEarned: xpEarned,
						totalXp: state.hunter.totalXpAllTime,
						level: state.hunter.level,
						notes: day.notes || "",
					};
					state.logs.unshift(entry);
					computeAchievements();
				}

				function checkRollover() {
					const current = todayStr();
					if (state.today.date !== current) {
						finalizeDay(state.today);
						const prevWeekKey = state.today.weekKey;
						const newWeekKey = getWeekKey(new Date());
						state.today = {
							date: current,
							quests: {
								learn: false,
								build: false,
								post: false,
								study: false,
								notes: false,
							},
							weeklyQuest:
								newWeekKey === prevWeekKey ? state.today.weeklyQuest : false,
							weekKey: newWeekKey,
							notes: "",
							bonusGranted: false,
						};
						state.resources.energy = 100;
						saveState();
					}
				}

				/* ============================================================
   QUEST INTERACTIONS
   ============================================================ */
				function checkPerfectDayBonus() {
					const allDone = QUEST_DEFS.every((q) => state.today.quests[q.id]);
					if (allDone && !state.today.bonusGranted) {
						state.today.bonusGranted = true;
						state.resources.gold += PERFECT_DAY_BONUS.gold;
						state.resources.gems += PERFECT_DAY_BONUS.gems;
						state.stats.perfectDays += 1;
						showToast(
							"\u{1F31F} PERFECT DAY! Bonus +" +
								PERFECT_DAY_BONUS.gold +
								" Gold, +" +
								PERFECT_DAY_BONUS.gems +
								" Gems",
							"achievement",
						);
					} else if (!allDone && state.today.bonusGranted) {
						state.today.bonusGranted = false;
						state.resources.gold = Math.max(
							0,
							state.resources.gold - PERFECT_DAY_BONUS.gold,
						);
						state.resources.gems = Math.max(
							0,
							state.resources.gems - PERFECT_DAY_BONUS.gems,
						);
						state.stats.perfectDays = Math.max(0, state.stats.perfectDays - 1);
					}
				}

				const STAT_KEY_FOR_QUEST = {
					learn: "totalLearns",
					build: "totalBuilds",
					post: "totalPosts",
					study: "totalStudies",
					notes: "totalNotesUpdates",
				};

				function setQuestState(id, checked) {
					const def = QUEST_DEFS.find((q) => q.id === id);
					if (!def) return;
					if (state.today.quests[id] === checked) return;

					state.today.quests[id] = checked;
					const sign = checked ? 1 : -1;

					addXP(sign * def.xp);
					state.resources.gold = Math.max(
						0,
						state.resources.gold + sign * def.gold,
					);
					if (def.gems)
						state.resources.gems = Math.max(
							0,
							state.resources.gems + sign * def.gems,
						);
					state.resources.energy = clamp(
						state.resources.energy - sign * def.energy,
						0,
						100,
					);

					if (checked) {
						state.stats.totalQuestsCompleted += 1;
						const statKey = STAT_KEY_FOR_QUEST[id];
						if (statKey) state.stats[statKey] += 1;
					}

					checkPerfectDayBonus();
					computeAchievements();
					saveState();
					renderAll();
				}

				function setWeeklyQuest(checked) {
					if (state.today.weeklyQuest === checked) return;
					state.today.weeklyQuest = checked;
					const sign = checked ? 1 : -1;
					addXP(sign * WEEKLY_QUEST.xp);
					state.resources.gold = Math.max(
						0,
						state.resources.gold + sign * WEEKLY_QUEST.gold,
					);
					state.resources.energy = clamp(
						state.resources.energy - sign * WEEKLY_QUEST.energy,
						0,
						100,
					);
					saveState();
					renderAll();
				}

				function adjustSkill(id, delta) {
					if (!(id in state.skills)) return;
					state.skills[id] = clamp(state.skills[id] + delta, 0, 100);
					saveState();
					renderSkills();
				}

				}

				/* ============================================================
   RENDER: DAILY LOG TABLE
   ============================================================ */
				function mark(bool) {
					return bool
						? '<i class="fa-solid fa-circle-check log-mark yes"></i>'
						: '<i class="fa-solid fa-circle-xmark log-mark no"></i>';
				}

				function renderLogTable() {
					const t = state.today;
					const todayName = new Date(t.date + "T00:00:00").toLocaleDateString(
						"en-US",
						{ weekday: "short" },
					);
					const liveXp =
						QUEST_DEFS.reduce(
							(sum, q) => sum + (t.quests[q.id] ? q.xp : 0),
							0,
						) + (t.weeklyQuest ? WEEKLY_QUEST.xp : 0);

					let todayRow =
						'<tr class="today-row">' +
						"<td>" +
						t.date +
						"</td>" +
						"<td>" +
						todayName +
						'<span class="today-tag">TODAY</span></td>' +
						'<td><input type="checkbox" class="log-check" data-log-quest="build" ' +
						(t.quests.build ? "checked" : "") +
						"></td>" +
						'<td><input type="checkbox" class="log-check" data-log-quest="learn" ' +
						(t.quests.learn ? "checked" : "") +
						"></td>" +
						'<td><input type="checkbox" class="log-check" data-log-quest="post" ' +
						(t.quests.post ? "checked" : "") +
						"></td>" +
						'<td><input type="checkbox" class="log-check" id="logWeeklyCheck" ' +
						(t.weeklyQuest ? "checked" : "") +
						"></td>" +
						"<td>" +
						liveXp +
						" XP</td>" +
						"<td>" +
						state.hunter.totalXpAllTime.toLocaleString() +
						"</td>" +
						"<td>Lv." +
						state.hunter.level +
						"</td>" +
						'<td><input type="text" class="log-notes-input" id="logNotesInput" placeholder="Add a note..." value="' +
						escapeHtml(t.notes) +
						'"></td>' +
						"</tr>";

					const historyRows = state.logs
						.map(
							(entry) =>
								"<tr>" +
								"<td>" +
								entry.date +
								"</td>" +
								"<td>" +
								entry.dayName +
								"</td>" +
								"<td>" +
								mark(entry.build) +
								"</td>" +
								"<td>" +
								mark(entry.learn) +
								"</td>" +
								"<td>" +
								mark(entry.post) +
								"</td>" +
								"<td>" +
								mark(entry.weeklyQuest) +
								"</td>" +
								"<td>" +
								entry.xpEarned +
								" XP</td>" +
								"<td>" +
								entry.totalXp.toLocaleString() +
								"</td>" +
								"<td>Lv." +
								entry.level +
								"</td>" +
								'<td><span class="log-notes-static" title="' +
								escapeHtml(entry.notes) +
								'">' +
								(escapeHtml(entry.notes) || "&mdash;") +
								"</span></td>" +
								"</tr>",
						)
						.join("");

					document.getElementById("logPanel").innerHTML =
						'<div class="card-title"><i class="fa-solid fa-table-list"></i> Daily Log <span class="sub">' +
						state.logs.length +
						" days logged</span></div>" +
						'<div class="log-table-wrap"><table class="log-table">' +
						"<thead><tr>" +
						"<th>Date</th><th>Day</th><th>Build?</th><th>Learn?</th><th>Post?</th><th>Weekly?</th><th>XP Earned</th><th>Total XP</th><th>Level</th><th>Notes</th>" +
						"</tr></thead>" +
						"<tbody>" +
						todayRow +
						historyRows +
						"</tbody>" +
						"</table></div>";

					document.querySelectorAll("[data-log-quest]").forEach((inp) => {
						inp.addEventListener("change", function () {
							setQuestState(this.getAttribute("data-log-quest"), this.checked);
						});
					});
					const logWeekly = document.getElementById("logWeeklyCheck");
					if (logWeekly) {
						logWeekly.addEventListener("change", function () {
							setWeeklyQuest(this.checked);
						});
					}
					const notesInput = document.getElementById("logNotesInput");
					if (notesInput) {
						notesInput.addEventListener("input", function () {
							state.today.notes = this.value;
							saveState();
						});
					}
				}

				/* ============================================================
   RENDER: ACHIEVEMENTS & REWARDS
   ============================================================ */
				function renderAchievements() {
					const unlockedCount = ACHIEVEMENT_DEFS.filter(
						(d) => state.achievements[d.id],
					).length;
					const items = ACHIEVEMENT_DEFS.map((def) => {
						const unlocked = !!state.achievements[def.id];
						return (
							'<div class="ach-item' +
							(unlocked ? " unlocked" : "") +
							'" title="' +
							escapeHtml(def.label) +
							'">' +
							'<div class="icon"><i class="fa-solid ' +
							(unlocked ? def.icon : "fa-lock") +
							'"></i></div>' +
							'<div class="name">' +
							escapeHtml(def.label) +
							"</div>" +
							"</div>"
						);
					}).join("");

					document.getElementById("achievementsPanel").innerHTML =
						'<div class="card-title"><i class="fa-solid fa-trophy"></i> Achievements</div>' +
						'<div class="ach-grid">' +
						items +
						"</div>" +
						'<div class="ach-progress"><b>' +
						unlockedCount +
						" / " +
						ACHIEVEMENT_DEFS.length +
						"</b> unlocked</div>";
				}

				function renderRewards() {
					const items = MILESTONES.map((m) => {
						const unlocked = state.hunter.level >= m.level;
						return (
							'<div class="reward-item' +
							(unlocked ? " unlocked" : "") +
							'">' +
							'<div class="reward-node">' +
							(unlocked ? '<i class="fa-solid fa-check"></i>' : m.level) +
							"</div>" +
							'<div class="reward-info"><div class="lvl">Level ' +
							m.level +
							'</div><div class="label">' +
							escapeHtml(m.label) +
							"</div></div>" +
							"</div>"
						);
					}).join("");

					document.getElementById("rewardsPanel").innerHTML =
						'<div class="card-title"><i class="fa-solid fa-gift"></i> Milestone Rewards</div>' +
						'<div class="rewards-list">' +
						items +
						"</div>";
				}

				/* ============================================================
   QUOTE
   ============================================================ */
				function renderQuote() {
					document.getElementById("quoteText").textContent =
						"\u201C" + QUOTES[state.currentQuoteIndex] + "\u201D";
				}

				function newQuote() {
					let next = state.currentQuoteIndex;
					if (QUOTES.length > 1) {
						while (next === state.currentQuoteIndex) {
							next = Math.floor(Math.random() * QUOTES.length);
						}
					}
					state.currentQuoteIndex = next;
					saveState();
					renderQuote();
				}

				/* ============================================================
   MASTER RENDER
   ============================================================ */
				function renderAll() {
					renderHunterStatus();
					renderResources();
					renderQuestBoard();
					renderSkills();
					renderLogTable();
					renderAchievements();
					renderRewards();
					renderQuote();
				}

				/* ============================================================
   RESET
   ============================================================ */
				function resetAll() {
					if (
						!confirm(
							"This will permanently erase your Hunter progress, quests, log history and stats. Continue?",
						)
					)
						return;
					state = defaultState();
					saveState();
					renderAll();
					showToast("Data reset. Welcome back, E-Rank Hunter.", "rankup");
				}

				/* ============================================================
   INIT
   ============================================================ */
				function init() {
					state = loadState();
					checkRollover();
					computeAchievements();
					renderAll();

					document
						.getElementById("resetBtn")
						.addEventListener("click", resetAll);
					document
						.getElementById("newQuoteBtn")
						.addEventListener("click", newQuote);
				}

				document.addEventListener("DOMContentLoaded", init);
			})();
		</script>
	</body>
</html>
